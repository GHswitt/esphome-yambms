views:
  - title: YamBMS
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: YamBMS - Battery
          - graph: line
            type: sensor
            entity: sensor.yambms_total_voltage
            detail: 2
            layout_options:
              grid_columns: 2
              grid_rows: 2
            name: Voltage
            hours_to_show: 8
          - graph: line
            type: sensor
            entity: sensor.yambms_battery_soc
            detail: 2
            name: SoC
            hours_to_show: 8
          - type: gauge
            entity: sensor.yambms_current
            needle: true
            severity:
              green: 0
              yellow: -125
              red: -250
            max: 250
            min: -250
            name: Current
            layout_options:
              grid_columns: 2
              grid_rows: 3
          - type: gauge
            entity: sensor.yambms_power
            needle: true
            severity:
              green: 0
              yellow: -5000
              red: -10000
            max: 10000
            min: -10000
            name: Power
            layout_options:
              grid_columns: 2
              grid_rows: 3
          - type: tile
            entity: sensor.yambms_installed_battery_capacity
            name: Installed Battery Capacity
            features_position: bottom
            vertical: false
          - type: tile
            entity: sensor.yambms_battery_soh
            name: Battery SoH
          - type: tile
            entity: sensor.yambms_battery_capacity
            name: Battery Capacity
            features_position: bottom
            vertical: false
          - type: tile
            entity: sensor.yambms_capacity_remaining
            name: Capacity Remaining
            features_position: bottom
            vertical: false
          - type: tile
            entity: sensor.yambms_delta_cell_voltage
            name: Delta Cell Voltage
            features_position: bottom
            vertical: false
          - type: tile
            entity: binary_sensor.yambms_equalizing_state
            name: Equalizing state
            vertical: false
            features_position: bottom
          - type: entities
            entities:
              - entity: sensor.yambms_max_cell_voltage
                name: Max Cell V.
              - entity: sensor.yambms_max_voltage_cell
                name: Cell number
            layout_options:
              grid_columns: 2
              grid_rows: 2
          - type: entities
            entities:
              - entity: sensor.yambms_min_cell_voltage
                name: Min Cell V.
              - entity: sensor.yambms_min_voltage_cell
                name: Cell number
            layout_options:
              grid_columns: 2
              grid_rows: 2
          - type: entities
            entities:
              - entity: sensor.yambms_max_temperature
                name: Max temp.
              - entity: sensor.yambms_max_temperature_sensor
                name: Sensor number
            layout_options:
              grid_columns: 2
              grid_rows: 2
          - type: entities
            entities:
              - entity: sensor.yambms_min_temperature
                name: Min temp.
              - entity: sensor.yambms_min_temperature_sensor
                name: Sensor number
            layout_options:
              grid_columns: 2
              grid_rows: 2
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: YamBMS - Status
          - type: tile
            entity: binary_sensor.canbus_1_status
            name: CANBUS Status
            vertical: false
            features_position: bottom
          - type: tile
            entity: binary_sensor.yambms_board_online_status
            name: ESP32 Status
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.yambms_charging_status
            name: Charging Status
          - type: tile
            entity: sensor.yambms_charging_instruction
            name: Charging Instruction
          - type: tile
            entity: sensor.yambms_alarm
            name: Alarm
          - type: tile
            entity: sensor.yambms_warning
            name: Warning
          - type: tile
            entity: binary_sensor.yambms_discharging_instruction
            name: Discharging Instruction
          - type: tile
            entity: binary_sensor.bms_heating
            name: Heating
            icon: mdi:heat-wave
            show_entity_picture: false
            hide_state: false
            vertical: false
            features_position: bottom
          - type: entities
            entities:
              - entity: sensor.yambms_bms_count
                name: BMS count
              - entity: sensor.yambms_bms_combined
                name: BMS combined
              - entity: sensor.yambms_bms_blocking_charge
                name: BMS blocking charge
              - entity: sensor.yambms_bms_blocking_discharge
                name: BMS blocking discharge
              - entity: sensor.yambms_bms_in_alarm
                name: BMS in alarm
            grid_options:
              columns: 6
              rows: 4
          - type: entities
            entities:
              - entity: sensor.yambms_shunt_count
                name: Shunt count
              - entity: sensor.yambms_shunt_combined
                name: Shunt combined
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: sensor.yambms_board_uptime
            name: ESP32 Uptime
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.yambms_last_complete_charge
            name: Last Complete Charge
          - type: entities
            entities:
              - entity: sensor.yambms_requested_charge_voltage
                name: Requested Charge Voltage
              - entity: sensor.yambms_requested_charge_current
                name: Requested Charge Current
              - entity: sensor.yambms_requested_discharge_voltage
                name: Requested Discharge Voltage
              - entity: sensor.yambms_requested_discharge_current
                name: Requested Discharge Current
              - entity: binary_sensor.yambms_requested_force_charge
                name: Requested Force Charge
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: YamBMS - Overview
            heading_style: title
          - type: markdown
            content: |
              {% set on = '<font color="#4CAF50"><b>ON</b></font>' %}
              {% set off = '<font color="#9e9e9e">OFF</font>' %}
              <table>
                <tr>
                  <td>CCL Derating Reason</td>
                  <td>{% set v = states('sensor.yambms_ccl_derating_reason') %}{% if v == 'No Derating' %}<font color="#4CAF50">{{ v }}</font>{% else %}<font color="#FFC107">{{ v }}</font>{% endif %} — {{ states('sensor.yambms_requested_charge_current')|float|round }} A</td>
                </tr>
                <tr>
                  <td>DCL Derating Reason</td>
                  <td>{% set v = states('sensor.yambms_dcl_derating_reason') %}{% if v == 'No Derating' %}<font color="#4CAF50">{{ v }}</font>{% else %}<font color="#FFC107">{{ v }}</font>{% endif %} — {{ states('sensor.yambms_requested_discharge_current')|float|round }} A</td>
                </tr>
                {% if is_state('switch.yambms_automatic_charge_voltage','on') %}
                <tr>
                  <td>Automatic Charge Voltage</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_automatic_charge_current','on') %}
                <tr>
                  <td>Automatic Charge Current</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_automatic_discharge_current','on') %}
                <tr>
                  <td>Automatic Discharge Current</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_temperature_based_current_limitation','on') %}
                <tr>
                  <td>Temp. Based Current Limit</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_automatic_eoc_current','on') %}
                <tr>
                  <td>Automatic EOC Current</td>
                  <td>{% set eoc_status = states('sensor.yambms_auto_eoc_status') %}{% set eoc_val %}{{ states('number.yambms_auto_eoc_target_hour') | int }}:{{ '%02d' % (states('number.yambms_auto_eoc_target_minute') | int) }} — {{ eoc_status }}{% endset %}{% if eoc_status.startswith('Stop:') %}<font color="#FFC107">{{ eoc_val }}</font>{% elif eoc_status.startswith('Run') %}<font color="#4CAF50">{{ eoc_val }}</font>{% else %}{{ eoc_val }}{% endif %}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_automatic_soc_limit','on') %}
                <tr>
                  <td>Automatic SoC Limit</td>
                  <td>{% set soc_status = states('sensor.yambms_auto_soc_limit_status') %}{% if soc_status.startswith('Stop:') %}<font color="#FFC107">{{ states('number.yambms_auto_soc_limit') }} % — {{ soc_status }}</font>{% elif soc_status == 'Run' %}<font color="#4CAF50">{{ states('number.yambms_auto_soc_limit') }} % — {{ soc_status }}</font>{% else %}{{ states('number.yambms_auto_soc_limit') }} % — {{ soc_status }}{% endif %}</td>
                </tr>
                {% endif %}
                {% set rebulk_days = states('number.yambms_rebulk_days') | int %}
                {% if rebulk_days != 0 %}
                <tr>
                  <td>Rebulk Days</td>
                  <td>{% set last = strptime(states('sensor.yambms_last_complete_charge') | trim, '%H:%M %d %b %Y') %}{% set remaining = (last.date() + timedelta(days=rebulk_days) - now().date()).days %}{{ rebulk_days }} days — {% if remaining < 0 %}<font color="#F44336">{{ remaining | abs }} overdue</font>{% elif remaining == 0 %}<font color="#F44336">{{ remaining }} remaining</font>{% elif remaining <= 2 %}<font color="#FFC107">{{ remaining }} remaining</font>{% else %}<font color="#4CAF50">{{ remaining }} remaining</font>{% endif %}</td>
                </tr>
                {% endif %}
                <tr>
                  <td>Rebulk SoC</td>
                  <td>{{ states('number.yambms_rebulk_soc')|float|round }} %</td>
                </tr>
                <tr>
                  <td>Rebulk Voltage</td>
                  <td>{{ states('number.yambms_rebulk_v')|float|round(2) }} V</td>
                </tr>
                <tr>
                  <td>Board Uptime</td>
                  <td>{{ states('sensor.yambms_board_uptime') }}</td>
                </tr>
                <tr>
                  <td>ESPHome Version</td>
                  <td>{{ states('sensor.yambms_board_esphome_version') }}</td>
                </tr>
                <tr>
                  <td>YamBMS Running version</td>
                  <td>{{ states('sensor.yambms_running_version') }}</td>
                </tr>
                <tr>
                  <td>YamBMS Last version</td>
                  <td>{{ states('sensor.yambms_last_version') }}</td>
                </tr>
              </table>
      - type: grid
        cards:
          - type: heading
            heading: Health
            heading_style: title
          - type: markdown
            content: |-
              | YamBMS | Instance Status |
              | :--- | :--- |
              {%- set raw = states('sensor.yambms_system_fault_data') %}
              {%- if raw not in ['unknown', 'unavailable', 'none'] %}
                  {%- set data = raw | from_json %}
                  {%- set names = ['API / MQTT', 'BMS', 'CAN->INV', 'RS485->INV', 'Shunt', 'Balancer', 'Network', 'Aux 1', 'Cat 8', 'Cat 9', 'Cat 10', 'Cat 11', 'Cat 12', 'Cat 13', 'Cat 14', 'Cat 15'] %}
                  {%- for cat_idx in range(0, 16) %}
                    {%- set instances = data[cat_idx] %}
                    {%- if instances | count > 0 %}
                      {%- set ns = namespace(visual='') %}
                      {%- for inst in instances %}
                        {#- Determine instance state -#}
                        {%- if inst == 1 %}
                           {#- Fault -#}
                           {%- set icon = '❌' %} 
                        {%- elif inst == 0 %}
                           {#- Healthy -#}
                           {%- set icon = '✅' %} 
                        {%- else %}
                           {#- Unregistered -#}
                           {%- set icon = ' ' %} 
                        {%- endif %}
                        {#- Use Em Space ( ) as separator -#}
                        {%- set ns.visual = ns.visual ~ icon ~ '  ' %}
                      {%- endfor %}
                | {{ names[cat_idx] }} | {{ ns.visual }} |
                    {%- endif %}
                  {%- endfor %}
                {%- else %}
              | System | Initializing... |
                {%- endif %}
          - type: markdown
            content: |-
              | YamBMS2 | Instance Status |
              | :--- | :--- |
              {%- set raw = states('sensor.yambms2_system_fault_data') %}
              {%- if raw not in ['unknown', 'unavailable', 'none'] %}
