                  {%- set names = ['API / MQTT', 'BMS', 'CAN->INV', 'RS485->INV', 'Shunt', 'Balancer', 'Network', 'Aux 1', 'Cat 8', 'Cat 9', 'Cat 10', 'Cat 11', 'Cat 12', 'Cat 13', 'Cat 14', 'Cat 15'] %}
                  {%- for cat_idx in range(0, 16) %}
                    {%- set instances = data[cat_idx] %}
                    {%- if instances | count > 0 %}
                      {%- set ns = namespace(visual='') %}
                      {%- for inst in instances %}
                        {#- Determine instance state -#}
                        {%- if inst == 1 %}
                           {#- Fault -#}
                           {%- set icon = '❌' %} 
                        {%- elif inst == 0 %}
                           {#- Healthy -#}
                           {%- set icon = '✅' %} 
                        {%- else %}
                           {#- Unregistered -#}
                           {%- set icon = ' ' %} 
                        {%- endif %}
                        {#- Use Em Space ( ) as separator -#}
                        {%- set ns.visual = ns.visual ~ icon ~ '  ' %}
                      {%- endfor %}
                | {{ names[cat_idx] }} | {{ ns.visual }} |
                    {%- endif %}
                  {%- endfor %}
                {%- else %}
              | System | Initializing... |
                {%- endif %}
          - type: markdown
            content: |-
              | YamBMS4 | Instance Status |
              | :--- | :--- |
              {%- set raw = states('sensor.yambms4_system_fault_data') %}
              {%- if raw not in ['unknown', 'unavailable', 'none'] %}
                  {%- set data = raw | from_json %}
                  {%- set names = ['API / MQTT', 'BMS', 'CAN->INV', 'RS485->INV', 'Shunt', 'Balancer', 'Network', 'Aux 1', 'Cat 8', 'Cat 9', 'Cat 10', 'Cat 11', 'Cat 12', 'Cat 13', 'Cat 14', 'Cat 15'] %}
                  {%- for cat_idx in range(0, 16) %}
                    {%- set instances = data[cat_idx] %}
                    {%- if instances | count > 0 %}
                      {%- set ns = namespace(visual='') %}
                      {%- for inst in instances %}
                        {#- Determine instance state -#}
                        {%- if inst == 1 %}
                           {#- Fault -#}
                           {%- set icon = '❌' %} 
                        {%- elif inst == 0 %}
                           {#- Healthy -#}
                           {%- set icon = '✅' %} 
                        {%- else %}
                           {#- Unregistered -#}
                           {%- set icon = ' ' %} 
                        {%- endif %}
                        {#- Use Em Space ( ) as separator -#}
                        {%- set ns.visual = ns.visual ~ icon ~ '  ' %}
                      {%- endfor %}
                | {{ names[cat_idx] }} | {{ ns.visual }} |
                    {%- endif %}
                  {%- endfor %}
                {%- else %}
              | System | Initializing... |
                {%- endif %}
    dense_section_placement: true
